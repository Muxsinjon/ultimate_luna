<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunaWindow: lunar landing site and mission window navigator</title>
    <meta
      name="description"
      content="Compare lunar landing sites and dates in seconds: when each site gets sunlight and a direct line to Earth, using real LRO LOLA terrain and JPL Horizons ephemerides."
    />
    <meta name="theme-color" content="#0d1220" />
    <meta name="ai-assistance" content="Software developed with AI assistance (Anthropic Claude). Data values are computed from cited NASA/JPL sources. Not a NASA product or endorsement." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="LunaWindow" />
    <meta
      property="og:description"
      content="LunaWindow: explore, compare and plan lunar landing sites and mission windows with sunlight and Earth visibility from JPL Horizons and LRO LOLA. NASA Space Apps Challenge 2026."
    />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A lunar horizon silhouette with the Sun about to set behind a ridge and Earth above the horizon." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="preload" href="./data/ephem.bin" as="fetch" type="application/octet-stream" crossorigin />
    <script>
      try {
        if (localStorage.getItem('llsn.theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>This tool needs JavaScript to compute Sun and Earth positions.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
